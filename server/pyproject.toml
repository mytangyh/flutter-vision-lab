[project]
name = "aicamera-cloud-proxy"
version = "0.1.0"
description = "AICAMERA OpenAI-compatible VLM proxy"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.31",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
