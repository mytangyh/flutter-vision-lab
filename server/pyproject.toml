[project]
name = "aicamera-cloud-proxy"
version = "0.2.0"
description = "Flutter Vision Lab OpenAI-compatible VLM proxy"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.31",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
