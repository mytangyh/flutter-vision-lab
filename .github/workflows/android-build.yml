name: Android release build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-build.yml
      - .fvmrc
      - android/**
      - assets/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: 3.27.4

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Flutter
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          flutter --version
          java -version

      - name: Install dependencies
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter precache --android
          flutter pub get

      - name: Build Android release APK
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --build-number="$GITHUB_RUN_NUMBER"

      - name: Package APK
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          output_dir="build/app/outputs/github"
          output_path="$output_dir/flutter-vision-lab-android-release.apk"

          test -f "$apk_path"
          mkdir -p "$output_dir"
          cp "$apk_path" "$output_path"
          sha256sum "$output_path" > "$output_path.sha256"

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-vision-lab-android-release-${{ github.run_number }}
          path: |
            build/app/outputs/github/*.apk
            build/app/outputs/github/*.sha256
          if-no-files-found: error
          retention-days: 7
